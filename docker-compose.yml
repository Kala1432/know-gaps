version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: knowledge-gap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledgegap}
      POSTGRES_USER: ${POSTGRES_USER:-kguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kgpassword}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kguser} -d ${POSTGRES_DB:-knowledgegap}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: knowledge-gap-ml-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: knowledge-gap-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-knowledgegap}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-kguser}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-kgpassword}
      - ML_SERVICE_URL=http://ml-service:8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: knowledge-gap-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
