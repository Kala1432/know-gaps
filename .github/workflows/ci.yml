name: Knowledge Gap Intelligence Platform CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test Multi-Tier Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Frontend Build
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache-dependency-path: frontend/package-lock.json

      - name: Build React Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      # 2. Spring Boot Backend Test
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Test Spring Boot Backend
        run: |
          cd backend
          mvn clean test

      # 3. Python ML Service Test & Evaluation
      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Test ML Service & Evaluation Checks
        run: |
          cd ml-service
          pip install -r requirements.txt
          pytest tests/
          PYTHONPATH=. python3 app/evaluation/evaluate_all.py

      # 4. Docker Compose Compilation Check
      - name: Validate Docker Compose Configuration & Image Compilation
        run: |
          docker compose config
          docker compose build
